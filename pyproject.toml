[project]
name = "sawyer"
version = "0.1.0"
description = "Sawyer robotics policy pretraining"
requires-python = ">=3.12"
# Pinned to the versions the project was developed and benchmarked with.
dependencies = [
    "torch==2.14.1",
    "torchvision==0.29.1",
    "transformers==5.20.2",
    "accelerate==1.15.0",
    "huggingface-hub==2.2.0",
    "safetensors==0.8.0",
    "timm==1.0.30",
    "einops==0.8.2",
    "av==19.0.2",
    "numpy==2.5.4",
    "scipy==1.18.1",
    "pyarrow==26.0.0",
    "pillow==13.0.0",
    "matplotlib==3.11.2",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sawyer*"]
